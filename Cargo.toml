[package]
name = "wireless-battery-monitor"
version = "0.3.0"
edition = "2021"
description = "Local Windows battery monitor for Logitech G435 and VXE MAD R"

[lib]
name = "wireless_battery_monitor"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", features = ["windows-native"] }
tray-icon = "0.19"
winit = "0.30"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
