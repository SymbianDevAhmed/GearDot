[package]
name = "wireless-battery-monitor"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.99"
description = "GearDot — a Windows battery monitor for connected peripherals"

[lib]
name = "wireless_battery_monitor"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
batteryhub = { path = "vendor/batteryhub-rust" }
hidapi = { version = "2.6", features = ["windows-native"] }
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
winit = "0.30"
windows = { version = "0.58", features = ["Foundation_Collections", "Gaming_Input", "Win32_System_WinRT", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_XboxController", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

[build-dependencies]
resvg = { version = "0.45", default-features = false }
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
