name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'assets/**'
      - 'vendor/**'
      - 'installer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish stable release after tests pass
        type: boolean
        default: false
      package_private:
        description: Build private Portable and Installer artifacts (do not publish a release)
        type: boolean
        default: false
      prepare_sources:
        description: Generate lockfile and format source (no executable or release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.prepare_sources
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Rust stable
        run: rustup default stable
      - name: Read package version
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          "version=$($metadata.packages[0].version)" >> $env:GITHUB_OUTPUT
      - name: Install quality tools
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: |
          if (git ls-files Cargo.lock) { cargo fmt -- --check }
          else { Write-Host "Initial source formatting is prepared separately." }
      - name: Run protocol and domain tests
        run: |
          if (Test-Path Cargo.lock) { cargo test --locked --all-targets }
          else { cargo test --all-targets }
      - name: Run Clippy
        run: cargo clippy --locked --all-targets
      - name: Build portable executables
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.package_private)
        run: cargo build --locked --release --bins
      - uses: msys2/setup-msys2@v2
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.package_private)
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Build the W.D.B.M device probe
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.package_private)
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          cmd.exe /d /c 'vendor\wdbm-cpp\build.bat'
          cp vendor/wdbm-cpp/BatteryHub.exe target/release/GearDot-DeviceProbe.exe
      - name: Fetch verified HeadsetControl and corresponding source
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.package_private)
        run: ./installer/get-headsetcontrol.ps1
      - name: Verify the Windows monitor stays running
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.package_private)
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'wbm-runtime-check'
          New-Item $folder -ItemType Directory -Force | Out-Null
          $exe = Join-Path $folder 'wireless-battery-monitor.exe'
          Copy-Item target/release/wireless-battery-monitor.exe $exe
          Copy-Item target/release/GearDot-DeviceProbe.exe,target/release/HeadsetControl.exe $folder
          New-Item (Join-Path $folder 'portable.flag') -ItemType File -Force | Out-Null
          $monitor = Start-Process -FilePath $exe -ArgumentList "--background" -PassThru
          try {
            if ($monitor.WaitForExit(70000)) {
              throw "Monitor exited during the startup check. Exit code: $($monitor.ExitCode)"
            }
            $log = Get-Content (Join-Path $folder 'data/monitor.log') -Raw
            if ($log -notmatch '\[device\]' -or $log -notmatch '\[bluetooth\] Connected-device probe responded' -or
                $log -notmatch '\[device driver\] batteryhub- responded' -or $log -notmatch '\[device driver\] wdbm- responded' -or
                $log -notmatch '\[device driver\] headsetcontrol- responded') {
              throw 'Monitor did not complete its initial connected-device checks.'
            }
            if ($log -match '\[(panic|runtime-error)\]') {
              throw 'Monitor logged a panic or a runtime error.'
            }
          } finally {
            $logFile = Join-Path $folder 'data/monitor.log'
            if (Test-Path $logFile) { Get-Content $logFile }
            if (!$monitor.HasExited) { Stop-Process -Id $monitor.Id }
          }
      - name: Package Windows installer
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.package_private)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $icon = Get-ChildItem target/release/build -Recurse -Filter GearDot.ico |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $icon) { throw "Generated application icon missing" }
          New-Item target/release-package -ItemType Directory -Force | Out-Null
          Copy-Item target/release/diagnostic.exe target/release-package/
          $stage = New-Item target/msi-files -ItemType Directory -Force
          Copy-Item target/release/diagnostic.exe,target/release/GearDot-DeviceProbe.exe,target/release/HeadsetControl.exe,LICENSE,THIRD-PARTY-NOTICES.txt,installer/GearDot.wxs,installer/setup-wrapper.nsi $stage
          Copy-Item target/release/wireless-battery-monitor.exe (Join-Path $stage GearDot.exe)
          Copy-Item $icon.FullName (Join-Path $stage GearDot.ico)
          $wizard = (Resolve-Path installer/add-msi-wizard.py).Path
          $databaseTool = (Resolve-Path installer/edit-msi.ps1).Path
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path (Join-Path $wix candle.exe))) {
            choco install wixtoolset --version 3.14.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Push-Location $stage
          try {
            & (Join-Path $wix candle.exe) -arch x64 "-dVersion=$env:VERSION" GearDot.wxs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $wix light.exe) -sice:ICE38 -sice:ICE91 -out GearDot-Setup-x64.msi GearDot.wixobj
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python $wizard GearDot-Setup-x64.msi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $productCode = & $databaseTool -Package (Resolve-Path 'GearDot-Setup-x64.msi').Path -ProductCode
            & $nsis "/DVERSION=$env:VERSION" "/DPRODUCT_CODE=$productCode" setup-wrapper.nsi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item GearDot-Setup-x64.exe,GearDot-Setup-x64.msi ../release-package/
          } finally {
            Pop-Location
          }
          $portable = "target/portable-files"
          New-Item $portable -ItemType Directory -Force | Out-Null
          Copy-Item target/release/wireless-battery-monitor.exe,target/release/diagnostic.exe,target/release/GearDot-DeviceProbe.exe,target/release/HeadsetControl.exe,LICENSE,THIRD-PARTY-NOTICES.txt $portable
          Rename-Item "$portable/wireless-battery-monitor.exe" "GearDot.exe"
          Copy-Item installer/PORTABLE.txt "$portable/README.txt"
          Set-Content "$portable/portable.flag" "Portable mode" -Encoding ascii
          Compress-Archive -Path "$portable/*" -DestinationPath target/release-package/GearDot-Portable.zip -Force
          git archive --format=zip --prefix="GearDot-$env:VERSION/" --output=target/release-package/GearDot-Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hashes = Get-ChildItem target/release-package -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location).Path "target/release-package/SHA256SUMS.txt"), ($hashes -join "`n") + "`n", [Text.Encoding]::ASCII)
      - name: Smoke-test both generated installers
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.package_private)
        run: |
          $testFolder = New-Item (Join-Path $env:RUNNER_TEMP 'geardot-installer-test') -ItemType Directory
          Copy-Item target/release-package/GearDot-Setup-x64.exe,target/release-package/GearDot-Setup-x64.msi $testFolder
          ./installer/test-installers.ps1 -PackageDirectory $testFolder.FullName
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.package_private)
        with:
          name: GearDot-windows-x64
          path: target/release-package/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && !inputs.prepare_sources
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: GearDot-windows-x64
          path: dist
      - name: Publish tested stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          gh release create "geardot-$VERSION" diagnostic.exe GearDot-Portable.zip GearDot-Setup-x64.exe GearDot-Setup-x64.msi GearDot-Source.zip headsetcontrol-4.3.0.tar.gz SHA256SUMS.txt --target "$GITHUB_SHA" --title "GearDot v$VERSION" --latest --notes "GearDot for Windows x64. Includes the BatteryHub and W.D.B.M device readers, Portable and Installer builds, and corresponding source. Available battery readings vary by device and connection."

  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.prepare_sources && !inputs.publish_release && !inputs.package_private
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Select Rust and format source
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo update --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt
      - name: Verify formatting and locked tests
        run: |
          cargo fmt -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --all-targets
      - name: Commit reproducible source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock build.rs src tests
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Lock dependencies and format Rust source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
