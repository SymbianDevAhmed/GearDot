name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish preview to Releases after tests pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust stable
        run: rustup default stable
      - name: Read package version
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          "version=$($metadata.packages[0].version)" >> $env:GITHUB_OUTPUT
      - name: Run protocol and domain tests
        run: cargo test --all-targets
      - name: Build portable executables
        run: cargo build --release --bins
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessBatteryMonitor-windows-x64
          path: |
            target/release/wireless-battery-monitor.exe
            target/release/diagnostic.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WirelessBatteryMonitor-windows-x64
          path: dist
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          cd dist
          zip WirelessBatteryMonitor-windows-x64.zip wireless-battery-monitor.exe diagnostic.exe
          gh release create "v$VERSION" wireless-battery-monitor.exe diagnostic.exe WirelessBatteryMonitor-windows-x64.zip --target "$GITHUB_SHA" --title "Wireless Battery Monitor v$VERSION" --prerelease --notes "Native dual-device battery widget for Logitech G435 and VXE MAD R. MAD R support is a hardware-validation preview. Automated tests passed."
